[tools]
direnv = "latest"
docker-compose = "latest"
go = "latest"
jq = "latest"
node = "lts"
opencode = "latest"
podman = { version = "latest", rename_exe = "podman-remote" }

[env]
# 環境変数は .envrc (direnv) で管理: cp .envrc.example .envrc && direnv allow
# .env は使用しないこと（opencode 内蔵の Bun が自動読み込みし環境変数を上書きするため）

[tasks.build]
description = "Go バイナリをビルド"
run = "go build -o trimetry ./cmd/trimetry/"

[tasks.test]
description = "テストを実行"
run = "go test ./..."

[tasks.setup-npmrc]
description = "~/.npmrc に GitHub Packages レジストリを設定"
run = '''
if ! grep -q "@konono:registry" ~/.npmrc 2>/dev/null; then
  echo "@konono:registry=https://npm.pkg.github.com/" >> ~/.npmrc
  echo "//npm.pkg.github.com/:_authToken=\${GITHUB_TOKEN}" >> ~/.npmrc
  echo "==> ~/.npmrc に @konono スコープを追加"
else
  echo "==> 設定済み"
fi
'''

[tasks.setup-opencode-plugin]
description = "opencode を最新化し observability プラグインをセットアップ"
run = """
echo "==> [1/4] opencode を最新版に更新"
mise upgrade opencode
echo "    opencode $(opencode -v)"

echo "==> [2/4] プラグインキャッシュ削除 (バージョン不整合回避)"
rm -rf ~/.cache/opencode/packages/@konono 2>/dev/null || true
rm -rf ~/.cache/opencode/packages/@mlflow 2>/dev/null || true
rm -rf ~/.cache/opencode/packages/@langfuse 2>/dev/null || true

echo "==> [3/4] Langfuse 公式プラグインインストール"
opencode plugin @langfuse/opencode-observability-plugin -f

echo "==> [4/4] ローカル plugin SDK を opencode に合わせて更新"
if [ -f .opencode/package.json ]; then
  OPENCODE_VER=$(opencode -v)
  cd .opencode && npm install "@opencode-ai/plugin@${OPENCODE_VER}" --save --silent 2>&1 && cd ..
  echo "    @opencode-ai/plugin@${OPENCODE_VER}"
fi

echo ""
echo "==> Setup complete!"
echo "    .envrc に LANGFUSE_BASEURL, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY を設定してください"
"""

[tasks.setup-mlflow]
description = "opencode + MLflow プラグインをセットアップ (Langfuse プラグインは削除)"
depends = ["setup-npmrc"]
run = """
echo "==> [1/2] Langfuse/MLflow 旧プラグイン削除 (競合回避)"
rm -rf ~/.cache/opencode/packages/@konono 2>/dev/null || true
rm -rf ~/.cache/opencode/packages/@mlflow 2>/dev/null || true

echo "==> [2/2] MLflow プラグインインストール"
opencode plugin @konono/opencode-plugin-mlflow -f

echo ""
echo "==> Setup complete!"
echo "    .envrc に MLFLOW_TRACKING_URI, MLFLOW_EXPERIMENT_ID を設定してください"
"""
