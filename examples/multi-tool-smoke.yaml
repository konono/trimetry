benchmark:
  name: multi-tool-smoke
  trials: 5
  concurrency: 1
  timeout_seconds: 120

scenarios:
  - id: count-go-files
    version: "1"
    name: Count Go Files in cmd/
    input: "How many .go files are in the cmd/trimetry/ directory? Answer with just the number."
    expected_output: "1"

models:
  - name: qwen36-35b-a3b
    provider: litellm

adapter:
  type: opencode
  options:
    working_directory: "."

telemetry:
  enabled: true
  provider: langfuse
  flush_on_trial_end: true

report:
  output_directory: benchmark-results
  formats:
    - json
    - markdown
